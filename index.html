<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB Fresh | Premium 3D Farm Boutique</title>
    
    <style>
        :root {
            --wood-dark: #140d07;
            --wood-panel: #24170e;
            --terracotta: #c25e00;
            --leaf-green: #2e7d32;
            --gold-accent: #dfa837;
            --cream-bg: #f7f3e9;
            --card-glass: rgba(36, 23, 14, 0.75);
            --border-wood: #3d2b1f;
            --shadow-realistic: 0 20px 40px rgba(0, 0, 0, 0.6);
            --card-perspective: 1200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        body {
            background: radial-gradient(circle at center, #2a1b10 0%, #0d0704 100%);
            color: #f7f3e9; min-height: 100vh; overflow-x: hidden;
        }

        /* REALISTIC MARKET BANNER */
        .top-banner {
            background: linear-gradient(90deg, #1e120a, #382110, #1e120a);
            border-bottom: 2px solid var(--gold-accent);
            text-align: center; padding: 10px; font-size: 0.9rem;
            color: var(--gold-accent); letter-spacing: 1px; font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* HEADER & LOGO */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(20, 13, 7, 0.9); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-wood);
            padding: 18px 6%; display: flex; justify-content: space-between; align-items: center;
        }

        .brand-logo {
            font-size: 1.8rem; font-weight: 900; color: #fff;
            text-decoration: none; display: flex; align-items: center; gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .brand-logo span { color: var(--gold-accent); font-style: italic; }

        .cart-trigger-btn {
            background: linear-gradient(135deg, var(--terracotta), #8d4000);
            color: #fff; font-weight: 800; padding: 12px 24px; border-radius: 50px;
            cursor: pointer; border: 1px solid var(--gold-accent); display: flex; align-items: center; gap: 12px;
            box-shadow: 0 6px 15px rgba(194, 94, 0, 0.4); transition: transform 0.2s;
        }
        .cart-trigger-btn:hover { transform: scale(1.05); }

        .cart-badge {
            background: var(--gold-accent); color: var(--wood-dark);
            border-radius: 50%; width: 24px; height: 24px; display: flex;
            align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 900;
        }

        /* HERO SECTION */
        .hero {
            padding: 50px 6% 20px; text-align: center;
            background: radial-gradient(ellipse at top, rgba(194, 94, 0, 0.15), transparent 70%);
        }
        .hero-badge {
            display: inline-block; background: rgba(223, 168, 55, 0.15);
            border: 1px solid var(--gold-accent); color: var(--gold-accent);
            padding: 6px 18px; border-radius: 30px; font-weight: 800; font-size: 0.85rem; margin-bottom: 15px;
        }
        .hero h1 { font-size: 2.8rem; font-weight: 900; margin-bottom: 10px; color: var(--cream-bg); text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hero p { color: #c4b5fd; color: #bfae9c; font-size: 1.05rem; max-width: 600px; margin: 0 auto; }

        /* REALISTIC 3D PRODUCT GRID */
        .container { max-width: 1280px; margin: 30px auto 80px; padding: 0 4%; }
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px;
            perspective: var(--card-perspective);
        }

        /* REALISTIC MARKET CARD */
        .product-card {
            background: linear-gradient(145deg, rgba(42, 27, 16, 0.9), rgba(20, 13, 7, 0.95));
            border: 1px solid var(--border-wood); border-radius: 24px; padding: 22px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: var(--shadow-realistic); transform-style: preserve-3d;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.3s;
        }

        .product-card::before {
            content: ''; position: absolute; inset: 0; border-radius: 24px;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 60%);
            pointer-events: none;
        }

        .product-card:hover {
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(223, 168, 55, 0.2);
        }

        .product-img-wrapper {
            height: 160px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px; background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            border-radius: 18px; position: relative; transform-style: preserve-3d;
        }

        .product-img {
            max-width: 90%; max-height: 130px; object-fit: contain;
            transform: translateZ(50px); filter: drop-shadow(0 20px 15px rgba(0,0,0,0.6));
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img {
            transform: translateZ(80px) scale(1.1);
        }

        .product-title {
            font-size: 1.2rem; font-weight: 800; color: #fff;
            transform: translateZ(30px); margin-bottom: 4px;
        }

        .product-unit { font-size: 0.85rem; color: #a89481; font-weight: 600; margin-bottom: 16px; transform: translateZ(20px); }

        .product-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08);
            transform: translateZ(35px);
        }
        
        .product-price { font-size: 1.4rem; font-weight: 900; color: var(--gold-accent); }

        /* OUT OF STOCK STYLING */
        .product-card.out-of-stock { opacity: 0.6; filter: grayscale(80%); }
        .out-stock-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) translateZ(90px);
            background: #b91c1c; color: #fff; font-weight: 900; font-size: 0.8rem;
            padding: 8px 16px; border-radius: 30px; display: none; text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .product-card.out-of-stock .out-stock-label { display: block; }

        /* BUTTONS & CONTROLS */
        .qty-controls { display: flex; align-items: center; background: rgba(0,0,0,0.5); border: 1px solid var(--border-wood); border-radius: 12px; padding: 4px; }
        .qty-btn {
            width: 30px; height: 30px; border: none; background: var(--terracotta); border-radius: 8px;
            font-weight: 900; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;
        }
        .qty-count { padding: 0 12px; font-weight: 800; font-size: 1rem; color: #fff; }

        .add-btn {
            background: linear-gradient(135deg, var(--leaf-green), #1b5e20); color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px; border-radius: 12px;
            font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
        }
        .add-btn:hover { transform: scale(1.05); }

        /* REALISTIC 3D KRAFT POLYBAG ANIMATION OVERLAY */
        .polybag-anim-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 9999; display: flex;
            align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .polybag-anim-overlay.active { opacity: 1; }
        .polybag-container {
            width: 160px; height: 180px; background: #8b5a2b; border: 3px solid #5c3a1b;
            border-radius: 10px 10px 40px 40px; position: relative; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); transform: scale(0.5) translateY(120px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .polybag-anim-overlay.active .polybag-container { transform: scale(1) translateY(0); }
        .falling-veg { width: 60px; position: absolute; top: -70px; animation: dropIn 0.5s ease-in forwards; }

        @keyframes dropIn {
            0% { top: -70px; opacity: 0; transform: scale(1.3); }
            100% { top: 40px; opacity: 1; transform: scale(0.8); }
        }

        /* POPUP MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .cart-popup {
            background: var(--wood-panel); border: 1px solid var(--border-wood); width: 100%; max-width: 480px;
            border-radius: 28px; padding: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.9); color: #fff;
        }
        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-wood); padding-bottom: 14px; margin-bottom: 16px; }
        .popup-close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 1.4rem; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; }
        .cart-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .cart-item { display: flex; align-items: center; gap: 14px; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 16px; border: 1px solid var(--border-wood); }
        .cart-item-img { width: 45px; height: 45px; object-fit: contain; }
        .checkout-fields { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
        .checkout-fields input, .checkout-fields textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border-wood); border-radius: 12px; padding: 12px; color: #fff; outline: none; }
        .checkout-whatsapp-btn {
            width: 100%; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; border: none; padding: 16px;
            border-radius: 14px; font-weight: 900; cursor: pointer; font-size: 1.05rem; margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="top-banner">🏺 MRATYUNJAY BRAHMAVANSHI - REALISTIC ORGANIC MARKET 🌾</div>

    <header>
        <a href="#" class="brand-logo">🍃 MB <span>Fresh Market</span></a>
        <button class="cart-trigger-btn" onclick="toggleCartPopup()">
            🛍️ Polybag Cart
            <div class="cart-badge" id="cartCount">0</div>
        </button>
    </header>

    <section class="hero">
        <div class="hero-badge">Direct Mandi Sourcing & Dynamic Google Sheets Sync</div>
        <h1>Real Farm Harvest Experience</h1>
        <p>Dynamic 3D depth, interactive realistic packaging & instant live sheet consumption.</p>
    </section>

    <main class="container">
        <div class="product-grid" id="productGrid"></div>
    </main>

    <div class="polybag-anim-overlay" id="polybagOverlay">
        <div class="polybag-container">
            <img id="animVegImg" class="falling-veg" src="" alt="Veg">
            <span style="position: absolute; bottom: 10px; font-size: 0.75rem; font-weight:900; color:var(--gold-accent);">PACKING REAL BAG...</span>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeOnOverlay(event)">
        <div class="cart-popup">
            <div class="popup-header">
                <h3 style="color:var(--gold-accent);">🛍️ Kraft Polybag Cart</h3>
                <button class="popup-close-btn" onclick="toggleCartPopup()">&times;</button>
            </div>
            <div class="cart-list" id="cartList"></div>
            <div style="margin-top:14px; border-top: 1px solid var(--border-wood); padding-top: 14px;">
                <div class="checkout-fields">
                    <input type="text" id="custName" placeholder="Full Name">
                    <textarea id="custAddr" rows="2" placeholder="Full Delivery Address"></textarea>
                </div>
                <div style="display:flex; justify-content:space-between; font-weight:900; font-size: 1.2rem; margin-top: 12px;">
                    <span>Grand Total:</span>
                    <span id="cartTotal" style="color: var(--gold-accent);">₹0</span>
                </div>
                <button class="checkout-whatsapp-btn" onclick="checkoutWhatsApp()">💬 Confirm Order & Consume Inventory</button>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZzv98fFFJduX0Lz6xSxkrhk23v7MrT473M2H5VdnoImUZ3nwbTA8ZCuGa54EVsFQ/exec"; 
        const WHATSAPP_NUMBER = "919896873022";

        let products = [
            { id: '1', name: 'Fresh Tomato (टमाटर)', unit: '1 kg', price: 40, stock: 20000, img: 'https://cdn-icons-png.flaticon.com/512/1202/1202125.png' },
            { id: '2', name: 'Fresh Potato (आलू)', unit: '1 kg', price: 30, stock: 30000, img: 'https://cdn-icons-png.flaticon.com/512/1135/1135544.png' },
            { id: '3', name: 'Green Chilli (हरी मिर्च)', unit: '250 g', price: 20, stock: 0, img: 'https://cdn-icons-png.flaticon.com/512/3983/3983584.png' },
            { id: '4', name: 'Fresh Onion (प्याज)', unit: '1 kg', price: 35, stock: 25000, img: 'https://cdn-icons-png.flaticon.com/512/1135/1135535.png' }
        ];

        let cart = [];

        // Real-Time Google Sheet Sync Load
        fetchLiveInventory();
        renderProducts();

        function fetchLiveInventory() {
            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) {
                fetch(APPS_SCRIPT_URL)
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            products = data;
                            renderProducts();
                        }
                    })
                    .catch(() => {});
            }
        }

        // Render Cards
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const isOutOfStock = p.stock <= 0;
                const cartItem = cart.find(item => item.id === p.id);
                const qty = cartItem ? cartItem.qty : 0;

                return `
                    <div class="product-card ${isOutOfStock ? 'out-of-stock' : ''}" onmousemove="handle3DTilt(event, this)" onmouseleave="reset3DTilt(this)">
                        <div class="product-img-wrapper">
                            <span class="out-stock-label">Out of Stock</span>
                            <img src="${p.img}" alt="${p.name}" loading="lazy" class="product-img">
                        </div>
                        <div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-unit">${p.unit}</div>
                        </div>
                        <div class="product-footer">
                            <div class="product-price">₹${p.price}</div>
                            ${isOutOfStock 
                                ? `<button class="add-btn" style="background:#444;" disabled>Unavailable</button>`
                                : qty > 0 
                                    ? `<div class="qty-controls">
                                        <button class="qty-btn" onclick="updateQty('${p.id}', -1, event)">-</button>
                                        <span class="qty-count">${qty}</span>
                                        <button class="qty-btn" onclick="updateQty('${p.id}', 1, event)">+</button>
                                       </div>`
                                    : `<button class="add-btn" onclick="triggerPolybagAnim('${p.img}'); updateQty('${p.id}', 1, event)">+ Add</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* Interactive Mouse 3D Tilt Logic */
        function handle3DTilt(e, card) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -18;
            const rotateY = ((x - centerX) / centerX) * 18;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        function reset3DTilt(card) {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        }

        /* 3D Polybag Packing Trigger */
        function triggerPolybagAnim(imgSrc) {
            const overlay = document.getElementById('polybagOverlay');
            const img = document.getElementById('animVegImg');
            img.src = imgSrc;
            overlay.classList.add('active');
            setTimeout(() => { overlay.classList.remove('active'); }, 700);
        }

        /* Cart Operations */
        function updateQty(productId, change, event) {
            if(event) event.stopPropagation();
            const product = products.find(p => p.id === productId);
            if (!product || product.stock <= 0) return;

            let cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                cartItem.qty += change;
                if (cartItem.qty <= 0) cart = cart.filter(item => item.id !== productId);
            } else if (change > 0) {
                cart.push({ ...product, qty: 1 });
            }

            renderProducts();
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cartCount').innerText = totalQty;
            document.getElementById('cartTotal').innerText = `₹${totalPrice}`;

            const listEl = document.getElementById('cartList');
            if(cart.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; color:#a89481; padding:30px 0;">Your kraft polybag is empty 🛒</div>`;
                return;
            }

            listEl.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.img}" class="cart-item-img">
                    <div style="flex-grow:1;">
                        <div style="font-weight:700; font-size:0.95rem;">${item.name}</div>
                        <div style="font-size:0.85rem; color:var(--gold-accent); font-weight:700;">₹${item.price} x ${item.qty}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('${item.id}', -1, event)">-</button>
                        <span class="qty-count">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty('${item.id}', 1, event)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCartPopup() {
            document.getElementById('modalOverlay').classList.toggle('active');
        }

        function closeOnOverlay(e) {
            if (e.target.id === 'modalOverlay') toggleCartPopup();
        }

        /* Order Checkout & Automatic Google Sheet Deduction */
        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("Cart is empty!");
            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddr').value.trim();
            if (!name || !address) return alert("Please fill Name & Address!");

            // Google Sheets Automatic Consumption Payload
            const updateItems = cart.map(item => {
                let gramWeight = 1000;
                if (item.unit.includes('500g')) gramWeight = 500;
                if (item.unit.includes('250g')) gramWeight = 250;
                return { id: item.id, qtyInGrams: gramWeight * item.qty };
            });

            if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.startsWith("http")) {
                fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ items: updateItems })
                });
            }

            let msg = `🛒 *NEW ORDER - MB REALISTIC MARKET*\n\n👤 *Customer:* ${name}\n📍 *Address:* ${address}\n\n📦 *ITEMS:*\n`;
            let grandTotal = 0;
            cart.forEach((item, i) => {
                const total = item.price * item.qty;
                grandTotal += total;
                msg += `${i + 1}. ${item.name} (${item.unit}) x ${item.qty} = ₹${total}\n`;
            });
            msg += `\n💰 *TOTAL AMOUNT:* ₹${grandTotal}`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
