<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB Fresh | Premium 3D Interactive Market</title>
    
    <style>
        :root {
            --wood-dark: #140d07;
            --wood-panel: #24170e;
            --terracotta: #c25e00;
            --leaf-green: #2e7d32;
            --gold-accent: #dfa837;
            --border-wood: #3d2b1f;
            --shadow-realistic: 0 20px 40px rgba(0, 0, 0, 0.7);
            --card-perspective: 1200px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        body {
            background: radial-gradient(circle at center, #2a1b10 0%, #0d0704 100%);
            color: #f7f3e9; min-height: 100vh; overflow-x: hidden;
        }

        .top-banner {
            background: linear-gradient(90deg, #1e120a, #382110, #1e120a);
            border-bottom: 2px solid var(--gold-accent);
            text-align: center; padding: 10px; font-size: 0.9rem;
            color: var(--gold-accent); letter-spacing: 1px; font-weight: 700;
        }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(20, 13, 7, 0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-wood);
            padding: 18px 6%; display: flex; justify-content: space-between; align-items: center;
        }

        .brand-logo {
            font-size: 1.8rem; font-weight: 900; color: #fff;
            text-decoration: none; display: flex; align-items: center; gap: 10px;
        }
        .brand-logo span { color: var(--gold-accent); font-style: italic; }

        .cart-trigger-btn {
            background: linear-gradient(135deg, var(--terracotta), #8d4000);
            color: #fff; font-weight: 800; padding: 12px 24px; border-radius: 50px;
            cursor: pointer; border: 1px solid var(--gold-accent); display: flex; align-items: center; gap: 12px;
            box-shadow: 0 6px 15px rgba(194, 94, 0, 0.4); transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .cart-trigger-btn.bounce { animation: cartPulse 0.4s ease-in-out; }
        @keyframes cartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); box-shadow: 0 0 25px var(--gold-accent); }
            100% { transform: scale(1); }
        }

        .cart-badge {
            background: var(--gold-accent); color: var(--wood-dark);
            border-radius: 50%; width: 24px; height: 24px; display: flex;
            align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 900;
        }

        .hero {
            padding: 40px 6% 20px; text-align: center;
            background: radial-gradient(ellipse at top, rgba(194, 94, 0, 0.15), transparent 70%);
        }
        .hero h1 { font-size: 2.5rem; font-weight: 900; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hero p { color: #bfae9c; font-size: 1rem; max-width: 650px; margin: 0 auto; }

        .container { max-width: 1280px; margin: 30px auto 80px; padding: 0 4%; }
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 32px;
            perspective: var(--card-perspective);
        }

        .product-card {
            background: linear-gradient(145deg, rgba(42, 27, 16, 0.95), rgba(20, 13, 7, 0.98));
            border: 1px solid var(--border-wood); border-radius: 24px; padding: 22px;
            position: relative; display: flex; flex-direction: column; justify-content: space-between;
            box-shadow: var(--shadow-realistic); transform-style: preserve-3d; cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.3s;
        }

        .product-card:hover {
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(223, 168, 55, 0.25);
        }

        .product-img-wrapper {
            height: 160px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 16px; background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 75%);
            border-radius: 18px; position: relative; transform-style: preserve-3d;
        }

        .product-icon {
            font-size: 5rem;
            transform: translateZ(50px); 
            filter: drop-shadow(0px 15px 10px rgba(0, 0, 0, 0.75));
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-icon {
            transform: translateZ(85px) scale(1.15) rotate(-5deg);
        }

        .product-title { font-size: 1.25rem; font-weight: 800; color: #fff; transform: translateZ(30px); margin-bottom: 4px; }
        .product-unit { font-size: 0.85rem; color: #a89481; font-weight: 600; margin-bottom: 16px; transform: translateZ(20px); }

        .product-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08);
            transform: translateZ(35px);
        }
        
        .product-price { font-size: 1.4rem; font-weight: 900; color: var(--gold-accent); }
        .product-card.out-of-stock { opacity: 0.5; filter: grayscale(90%); pointer-events: none; }
        .out-stock-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) translateZ(100px);
            background: #b91c1c; color: #fff; font-weight: 900; font-size: 0.85rem;
            padding: 8px 18px; border-radius: 30px; display: none; text-transform: uppercase;
        }
        .product-card.out-of-stock .out-stock-label { display: block; }

        .qty-controls { display: flex; align-items: center; background: rgba(0,0,0,0.6); border: 1px solid var(--border-wood); border-radius: 12px; padding: 4px; }
        .qty-btn {
            width: 32px; height: 32px; border: none; background: var(--terracotta); border-radius: 8px;
            font-weight: 900; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center;
        }
        .qty-count { padding: 0 12px; font-weight: 800; font-size: 1rem; color: #fff; }

        .add-btn {
            background: linear-gradient(135deg, var(--leaf-green), #1b5e20); color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2); padding: 10px 22px; border-radius: 12px;
            font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(46, 125, 50, 0.4);
        }

        /* 3D SPOTLIGHT PREVIEW MODAL */
        .preview-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .preview-overlay.active { display: flex; }
        .preview-card-3d {
            background: linear-gradient(145deg, #24170e, #140d07); border: 2px solid var(--gold-accent);
            border-radius: 32px; padding: 35px; width: 100%; max-width: 440px; text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), 0 0 30px rgba(223, 168, 55, 0.3);
            position: relative; transform-style: preserve-3d; animation: float3d 3s ease-in-out infinite alternate;
        }
        @keyframes float3d {
            0% { transform: translateY(0px) rotateY(-5deg); }
            100% { transform: translateY(-12px) rotateY(5deg); }
        }
        .preview-icon { font-size: 6rem; filter: drop-shadow(0 25px 20px rgba(0,0,0,0.8)); margin: 0 auto 10px; display: block; }
        .preview-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin-bottom: 6px; }
        .preview-price { font-size: 1.6rem; color: var(--gold-accent); font-weight: 900; margin-bottom: 20px; }

        /* CINEMATIC PACKAGING OVERLAY */
        .cinematic-stage {
            position: fixed; inset: 0; pointer-events: none; z-index: 99999;
            display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s;
        }
        .cinematic-stage.active { opacity: 1; pointer-events: auto; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }

        .packaging-box {
            width: 200px; height: 260px; position: absolute;
            transform-style: preserve-3d; transition: all 0.7s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .polybag-body {
            width: 100%; height: 100%; background: linear-gradient(180deg, #aa733c, #73481e);
            border: 2px solid #573311; border-radius: 12px 12px 36px 36px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.4);
            position: relative; overflow: hidden; display: flex; justify-content: center;
        }

        .bag-seal-flap {
            position: absolute; top: 0; left: 0; right: 0; height: 35px;
            background: linear-gradient(180deg, #6e441d, #42270e); border-bottom: 3px dashed var(--gold-accent);
            transform-origin: top; transition: transform 0.4s ease-in-out; z-index: 5;
        }
        .bag-seal-flap.sealed { transform: rotateX(180deg); }
        .bag-logo-mark { position: absolute; bottom: 25px; color: rgba(255,255,255,0.25); font-size: 0.8rem; font-weight: 900; letter-spacing: 2px; }

        .anim-item-icon {
            font-size: 4.5rem; position: absolute; top: -120px;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.7)); opacity: 0;
            transition: all 0.5s cubic-bezier(0.6, -0.28, 0.735, 0.045); z-index: 4;
        }
        .anim-item-icon.drop-in { top: 70px; opacity: 1; transform: scale(0.85) rotate(12deg); }

        .packaging-box.fly-to-cart {
            transform: translate(var(--target-x), var(--target-y)) scale(0.12) rotate(360deg) !important;
            opacity: 0;
        }

        canvas#particleCanvas { position: absolute; inset: 0; pointer-events: none; z-index: 6; }

        /* CART MODAL */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 999; display: none; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .cart-popup {
            background: var(--wood-panel); border: 1px solid var(--border-wood); width: 100%; max-width: 480px;
            border-radius: 28px; padding: 28px; box-shadow: 0 30px 60px rgba(0,0,0,0.9); color: #fff;
        }
        .popup-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-wood); padding-bottom: 14px; margin-bottom: 16px; }
        .popup-close-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 1.4rem; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; }
        .cart-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .cart-item { display: flex; align-items: center; gap: 14px; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 16px; border: 1px solid var(--border-wood); }
        .cart-item-icon { font-size: 2rem; }
        .checkout-fields { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
        .checkout-fields input, .checkout-fields textarea { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border-wood); border-radius: 12px; padding: 12px; color: #fff; outline: none; }
        .checkout-whatsapp-btn {
            width: 100%; background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; border: none; padding: 16px;
            border-radius: 14px; font-weight: 900; cursor: pointer; font-size: 1.05rem; margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="top-banner">🏺 MRATYUNJAY BRAHMAVANSHI - REALISTIC 3D ORGANIC MARKET 🌾</div>

    <header>
        <a href="#" class="brand-logo">🍃 MB <span>Fresh Market</span></a>
        <button class="cart-trigger-btn" id="cartBtn" onclick="toggleCartPopup()">
            🛍️ Kraft Polybag
            <div class="cart-badge" id="cartCount">0</div>
        </button>
    </header>

    <section class="hero">
        <h1>Realistic Interactive Harvest</h1>
        <p>Click any product card to preview in 3D spotlight or press "+ Add" to trigger the Polybag animation.</p>
    </section>

    <main class="container">
        <div class="product-grid" id="productGrid"></div>
    </main>

    <!-- 3D SPOTLIGHT PREVIEW MODAL -->
    <div class="preview-overlay" id="previewOverlay" onclick="closePreviewOnOverlay(event)">
        <div class="preview-card-3d" id="previewCard">
            <button class="popup-close-btn" onclick="closePreview()" style="position:absolute; top:15px; right:15px;">&times;</button>
            <div id="prevIcon" class="preview-icon"></div>
            <div id="prevTitle" class="preview-title"></div>
            <div id="prevUnit" style="color:#a89481; margin-bottom:10px;"></div>
            <div id="prevPrice" class="preview-price"></div>
            <button id="prevAddBtn" class="add-btn" style="width:100%; padding:14px; font-size:1.1rem;">+ Add To Kraft Polybag</button>
        </div>
    </div>

    <!-- CINEMATIC STAGE OVERLAY -->
    <div class="cinematic-stage" id="cinematicStage">
        <canvas id="particleCanvas"></canvas>
        <div class="packaging-box" id="packagingBox">
            <div class="polybag-body">
                <div class="bag-seal-flap" id="bagFlap"></div>
                <div id="animVegIcon" class="anim-item-icon"></div>
                <div class="bag-logo-mark">MB ORGANIC</div>
            </div>
        </div>
    </div>

    <!-- CART POPUP MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeOnOverlay(event)">
        <div class="cart-popup">
            <div class="popup-header">
                <h3 style="color:var(--gold-accent);">🛍️ Sealed Polybag Cart</h3>
                <button class="popup-close-btn" onclick="toggleCartPopup()">&times;</button>
            </div>
            <div class="cart-list" id="cartList"></div>
            <div style="margin-top:14px; border-top: 1px solid var(--border-wood); padding-top: 14px;">
                <div class="checkout-fields">
                    <input type="text" id="custName" placeholder="Full Name">
                    <textarea id="custAddr" rows="2" placeholder="Full Delivery Address"></textarea>
                </div>
                <div style="display:flex; justify-content:space-between; font-weight:900; font-size: 1.2rem; margin-top: 12px;">
                    <span>Grand Total:</span>
                    <span id="cartTotal" style="color: var(--gold-accent);">₹0</span>
                </div>
                <button class="checkout-whatsapp-btn" onclick="checkoutWhatsApp()">💬 Confirm Order via WhatsApp</button>
            </div>
        </div>
    </div>

    <script>
        const WHATSAPP_NUMBER = "919896873022";

        const products = [
            { id: '1', name: 'Fresh Red Tomatoes (टमाटर)', unit: '1 kg', price: 40, stock: 20000, icon: '🍅' },
            { id: '2', name: 'Fresh Farm Potatoes (आलू)', unit: '1 kg', price: 30, stock: 30000, icon: '🥔' },
            { id: '3', name: 'Spicy Green Chillies (हरी मिर्च)', unit: '250 g', price: 20, stock: 15000, icon: '🌶️' },
            { id: '4', name: 'Fresh Red Onions (प्याज)', unit: '1 kg', price: 35, stock: 25000, icon: '🧅' },
            { id: '5', name: 'Organic Cauliflower (फूलगोभी)', unit: '1 pc', price: 45, stock: 10000, icon: '🥦' },
            { id: '6', name: 'Crunchy Carrots (गाजर)', unit: '500 g', price: 30, stock: 18000, icon: '🥕' }
        ];

        let cart = [];

        renderProducts();

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const isOutOfStock = p.stock <= 0;
                const cartItem = cart.find(item => item.id === p.id);
                const qty = cartItem ? cartItem.qty : 0;

                return `
                    <div class="product-card ${isOutOfStock ? 'out-of-stock' : ''}" 
                         onclick="open3DPreview('${p.id}')"
                         onmousemove="handle3DTilt(event, this)" 
                         onmouseleave="reset3DTilt(this)">
                        <div class="product-img-wrapper">
                            <span class="out-stock-label">Out of Stock</span>
                            <div class="product-icon">${p.icon}</div>
                        </div>
                        <div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-unit">${p.unit}</div>
                        </div>
                        <div class="product-footer">
                            <div class="product-price">₹${p.price}</div>
                            ${isOutOfStock 
                                ? `<button class="add-btn" style="background:#444;" disabled>Unavailable</button>`
                                : qty > 0 
                                    ? `<div class="qty-controls" onclick="event.stopPropagation()">
                                        <button class="qty-btn" onclick="updateQty('${p.id}', -1, event)">-</button>
                                        <span class="qty-count">${qty}</span>
                                        <button class="qty-btn" onclick="updateQty('${p.id}', 1, event)">+</button>
                                       </div>`
                                    : `<button class="add-btn" onclick="startCinematicPacking('${p.id}', event)">+ Add</button>`
                            }
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* 3D SPOTLIGHT PREVIEW LOGIC */
        function open3DPreview(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            document.getElementById('prevIcon').innerText = product.icon;
            document.getElementById('prevTitle').innerText = product.name;
            document.getElementById('prevUnit').innerText = product.unit;
            document.getElementById('prevPrice').innerText = `₹${product.price}`;
            
            const addBtn = document.getElementById('prevAddBtn');
            addBtn.onclick = (e) => {
                closePreview();
                startCinematicPacking(product.id, e);
            };

            document.getElementById('previewOverlay').classList.add('active');
        }

        function closePreview() { document.getElementById('previewOverlay').classList.remove('active'); }
        function closePreviewOnOverlay(e) { if (e.target.id === 'previewOverlay') closePreview(); }

        /* 3D TILT EFFECT */
        function handle3DTilt(e, card) {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            const centerX = rect.width / 2, centerY = rect.height / 2;
            card.style.transform = `rotateX(${((y - centerY) / centerY) * -16}deg) rotateY(${((x - centerX) / centerX) * 16}deg)`;
        }
        function reset3DTilt(card) { card.style.transform = `rotateX(0deg) rotateY(0deg)`; }

        /* CINEMATIC 3D PACKAGING ANIMATION */
        function startCinematicPacking(productId, event) {
            if(event) event.stopPropagation();
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const stage = document.getElementById('cinematicStage');
            const box = document.getElementById('packagingBox');
            const flap = document.getElementById('bagFlap');
            const icon = document.getElementById('animVegIcon');
            const cartBtn = document.getElementById('cartBtn');

            icon.innerText = product.icon;
            icon.classList.remove('drop-in');
            flap.classList.remove('sealed');
            box.className = 'packaging-box';
            box.style.transform = 'scale(0.8) translateY(50px)';
            stage.classList.add('active');

            // 1. Drop into Bag
            setTimeout(() => {
                box.style.transform = 'scale(1) translateY(0)';
                icon.classList.add('drop-in');
            }, 100);

            // 2. Seal Ziplock & Particles
            setTimeout(() => {
                flap.classList.add('sealed');
                triggerSealingParticles();
            }, 650);

            // 3. Fly & Disappear to Cart
            setTimeout(() => {
                const cartRect = cartBtn.getBoundingClientRect();
                const boxRect = box.getBoundingClientRect();
                
                const targetX = (cartRect.left + cartRect.width/2) - (boxRect.left + boxRect.width/2);
                const targetY = (cartRect.top + cartRect.height/2) - (boxRect.top + boxRect.height/2);

                box.style.setProperty('--target-x', `${targetX}px`);
                box.style.setProperty('--target-y', `${targetY}px`);
                box.classList.add('fly-to-cart');
            }, 1100);

            // 4. Update Cart State
            setTimeout(() => {
                stage.classList.remove('active');
                updateQty(productId, 1, null);
                cartBtn.classList.add('bounce');
                setTimeout(() => cartBtn.classList.remove('bounce'), 400);
            }, 1750);
        }

        /* PARTICLE EFFECT */
        function triggerSealingParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const centerX = window.innerWidth / 2;
            const centerY = (window.innerHeight / 2) - 80;

            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: centerX + (Math.random() - 0.5) * 120,
                    y: centerY,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 1) * 3 - 1,
                    size: Math.random() * 5 + 2,
                    color: Math.random() > 0.4 ? '#dfa837' : '#ffffff',
                    alpha: 1
                });
            }

            function renderParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                particles.forEach(p => {
                    if (p.alpha > 0) {
                        active = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha -= 0.03;
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                if (active) requestAnimationFrame(renderParticles);
            }
            renderParticles();
        }

        /* CART MANAGEMENT */
        function updateQty(productId, change, event) {
            if(event) event.stopPropagation();
            const product = products.find(p => p.id === productId);
            if (!product || product.stock <= 0) return;

            let cartItem = cart.find(item => item.id === productId);
            if (cartItem) {
                cartItem.qty += change;
                if (cartItem.qty <= 0) cart = cart.filter(item => item.id !== productId);
            } else if (change > 0) {
                cart.push({ ...product, qty: 1 });
            }

            renderProducts();
            updateCartUI();
        }

        function updateCartUI() {
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            document.getElementById('cartCount').innerText = totalQty;
            document.getElementById('cartTotal').innerText = `₹${totalPrice}`;

            const listEl = document.getElementById('cartList');
            if(cart.length === 0) {
                listEl.innerHTML = `<div style="text-align:center; color:#a89481; padding:30px 0;">Your kraft polybag is empty 🛒</div>`;
                return;
            }

            listEl.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-icon">${item.icon}</div>
                    <div style="flex-grow:1;">
                        <div style="font-weight:700; font-size:0.95rem;">${item.name}</div>
                        <div style="font-size:0.85rem; color:var(--gold-accent); font-weight:700;">₹${item.price} x ${item.qty}</div>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty('${item.id}', -1, event)">-</button>
                        <span class="qty-count">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty('${item.id}', 1, event)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCartPopup() { document.getElementById('modalOverlay').classList.toggle('active'); }
        function closeOnOverlay(e) { if (e.target.id === 'modalOverlay') toggleCartPopup(); }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("Cart is empty!");
            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddr').value.trim();
            if (!name || !address) return alert("Please fill Name & Address!");

            let msg = `🛒 *NEW ORDER - MB REALISTIC MARKET*\n\n👤 *Customer:* ${name}\n📍 *Address:* ${address}\n\n📦 *ITEMS:*\n`;
            let grandTotal = 0;
            cart.forEach((item, i) => {
                const total = item.price * item.qty;
                grandTotal += total;
                msg += `${i + 1}. ${item.name} (${item.unit}) x ${item.qty} = ₹${total}\n`;
            });
            msg += `\n💰 *TOTAL AMOUNT:* ₹${grandTotal}`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
