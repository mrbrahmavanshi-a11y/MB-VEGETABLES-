<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB Vegetables | Live Fresh Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #090f15;
            --bg-card: rgba(20, 31, 44, 0.75);
            --accent-green: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.35);
            --accent-bright: #34d399;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
            --danger-red: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(9, 15, 21, 0.85); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 5%; display: flex; justify-content: space-between; align-items: center;
        }

        .brand-logo { font-size: 1.5rem; font-weight: 800; color: #fff; text-decoration: none; }
        .brand-logo span { color: var(--accent-bright); }

        .cart-trigger-btn {
            background: linear-gradient(135deg, var(--accent-green), #059669);
            color: #000; font-weight: 700; padding: 10px 20px; border-radius: 50px;
            cursor: pointer; border: none; display: flex; align-items: center; gap: 10px;
        }

        .cart-badge { background: #000; color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        .hero-banner { padding: 30px 5% 10px; text-align: center; }
        .hero-banner h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }

        .container { max-width: 1240px; margin: 0 auto; padding: 20px 5% 80px; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }

        .product-card {
            background: var(--bg-card); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 20px; text-align: center; position: relative;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .stock-badge {
            position: absolute; top: 12px; right: 12px;
            font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px;
        }
        .stock-badge.in-stock { background: rgba(16, 185, 129, 0.2); color: var(--accent-bright); border: 1px solid var(--accent-green); }
        .stock-badge.out-stock { background: rgba(239, 68, 68, 0.2); color: var(--danger-red); border: 1px solid var(--danger-red); }

        .product-img-wrapper { height: 140px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .product-img { max-width: 80%; max-height: 120px; object-fit: contain; }

        .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
        .product-unit { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 12px; }

        .product-footer { display: flex; align-items: center; justify-content: space-between; }
        .product-price { font-size: 1.25rem; font-weight: 800; color: var(--accent-bright); }

        .add-btn {
            background: rgba(16, 185, 129, 0.15); color: var(--accent-bright);
            border: 1px solid var(--accent-green); padding: 8px 14px; border-radius: 10px;
            font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .add-btn:hover { background: var(--accent-green); color: #000; }
        .add-btn:disabled { background: rgba(255,255,255,0.05); color: #64748b; border-color: transparent; cursor: not-allowed; }

        /* POLYBAG STAGE ANIMATION */
        .animation-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 10, 15, 0.85); backdrop-filter: blur(8px); z-index: 900;
            display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .animation-overlay.active { opacity: 1; pointer-events: auto; }

        .polybag-stage {
            position: relative; width: 300px; height: 400px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            transform: translateY(100px); transition: transform 0.4s;
        }
        .animation-overlay.active .polybag-stage { transform: translateY(0); }

        .polybag-container {
            position: relative; width: 220px; height: 250px;
            background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px 16px 40px 40px; overflow: hidden; display: flex; align-items: flex-end; justify-content: center;
        }
        .polybag-seal-line {
            position: absolute; top: 12px; width: 100%; height: 6px;
            background: var(--accent-bright); transform: scaleX(0); transition: transform 0.4s;
        }
        .polybag-seal-line.sealed { transform: scaleX(1); }
        .pack-badge {
            position: absolute; top: -50px; background: var(--accent-green); color: #000;
            font-weight: 800; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem;
        }
        .shower-particle { position: absolute; width: 40px; height: 40px; object-fit: contain; }

        .polybag-stage.fly-to-cart {
            animation: flyCart 0.7s forwards;
        }
        @keyframes flyCart {
            100% { transform: scale(0.1) translate(600px, -600px); opacity: 0; }
        }

        /* CART DRAWER */
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 950; opacity: 0; pointer-events: none; }
        .drawer-overlay.active { opacity: 1; pointer-events: auto; }

        .cart-drawer {
            position: fixed; top: 0; right: -420px; width: 100%; max-width: 400px; height: 100vh;
            background: #0f172a; z-index: 1000; transition: right 0.3s; padding: 24px; display: flex; flex-direction: column;
        }
        .cart-drawer.active { right: 0; }
        .drawer-header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--glass-border); padding-bottom: 14px; margin-bottom: 14px; }
        .cart-list { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .cart-item { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; }
        .cart-item img { width: 40px; height: 40px; object-fit: contain; }

        .checkout-fields { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
        .checkout-fields input, .checkout-fields textarea {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 8px; padding: 10px; color: #fff; outline: none;
        }

        .checkout-whatsapp-btn {
            width: 100%; background: #25D366; color: #fff; border: none; padding: 14px;
            border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 12px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand-logo"><i class="fa-solid fa-leaf" style="color: #10b981;"></i> <span>MB Vegetables</span></a>
        <button class="cart-trigger-btn" id="cartTrigger" onclick="toggleCart()">
            <i class="fa-solid fa-basket-shopping"></i> Cart
            <div class="cart-badge" id="cartCount">0</div>
        </button>
    </header>

    <section class="hero-banner">
        <h1>Fresh Vegetables Live Inventory</h1>
        <p id="loadingStatus" style="color: var(--accent-bright); font-size: 0.9rem;">Fetching live stock from Google Sheet...</p>
    </section>

    <main class="container">
        <div class="product-grid" id="productGrid">
            <!-- Dynamic items from Google Sheet -->
        </div>
    </main>

    <!-- POLYBAG ANIMATION MODAL -->
    <div class="animation-overlay" id="animOverlay">
        <div class="polybag-stage" id="polybagStage">
            <div class="pack-badge" id="packBadge">PACKING...</div>
            <div class="polybag-container" id="polybagBag">
                <div class="polybag-seal-line" id="sealLine"></div>
            </div>
        </div>
    </div>

    <!-- CART SIDEBAR -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="drawer-header">
            <h3><i class="fa-solid fa-bag-shopping" style="color: var(--accent-green);"></i> Shopping Bag</h3>
            <button style="background:none; border:none; color:#fff; font-size:1.4rem; cursor:pointer;" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-list" id="cartList"></div>
        <div style="border-top:1px solid var(--glass-border); padding-top:14px; margin-top:14px;">
            <div class="checkout-fields">
                <input type="text" id="custName" placeholder="Aapka Naam">
                <textarea id="custAddr" rows="2" placeholder="Full Delivery Address"></textarea>
            </div>
            <div style="display:flex; justify-content:space-between; font-weight:800; font-size:1.1rem; margin-top:12px;">
                <span>Total Amount:</span>
                <span id="cartTotal" style="color: var(--accent-bright);">₹0</span>
            </div>
            <button class="checkout-whatsapp-btn" onclick="checkoutWhatsApp()">
                <i class="fa-brands fa-whatsapp" style="font-size:1.2rem;"></i> Order via WhatsApp
            </button>
        </div>
    </div>

    <script>
        // ================= CONFIGURATION =================
        // STEP 1 ME COPIED APPS SCRIPT URL PAR YAHAN PASTE KAREIN:
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygU48VFNNv0rs4SUohRvChpv0AH4LmRumJ4_0EWVsbhzN853octqyP5wY-OzjtjGwa/exec
"; 
        const WHATSAPP_NUMBER = "919896873022"; // Aapka WhatsApp number

        let products = [];
        let cart = [];

        window.addEventListener('DOMContentLoaded', fetchInventory);

        function fetchInventory() {
            document.getElementById('loadingStatus').innerText = "Syncing live inventory from Google Sheet...";
            fetch(APPS_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    products = data;
                    renderProducts();
                    document.getElementById('loadingStatus').innerText = "Live Stock Connected 🟢";
                })
                .catch(err => {
                    document.getElementById('loadingStatus').innerText = "Error loading sheet. Using backup data.";
                    console.error(err);
                });
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const isOutOfStock = p.stock <= 0;
                return `
                    <div class="product-card">
                        <div class="stock-badge ${isOutOfStock ? 'out-stock' : 'in-stock'}">
                            ${isOutOfStock ? 'OUT OF STOCK' : 'IN STOCK (' + p.stock + 'g left)'}
                        </div>
                        <div class="product-img-wrapper">
                            <img src="${p.img}" alt="${p.name}" class="product-img">
                        </div>
                        <div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-unit">${p.unit}</div>
                        </div>
                        <div class="product-footer">
                            <div class="product-price">₹${p.price}</div>
                            <button class="add-btn" ${isOutOfStock ? 'disabled' : ''} onclick="triggerPacking('${p.id}')">
                                ${isOutOfStock ? 'Unavailable' : '+ Add'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function triggerPacking(productId) {
            const product = products.find(p => p.id === productId);
            if (!product || product.stock <= 0) return;

            const overlay = document.getElementById('animOverlay');
            const stage = document.getElementById('polybagStage');
            const bag = document.getElementById('polybagBag');
            const badge = document.getElementById('packBadge');
            const sealLine = document.getElementById('sealLine');

            stage.className = 'polybag-stage';
            sealLine.classList.remove('sealed');
            badge.innerText = `PACKING ${product.name.toUpperCase()}...`;
            
            bag.querySelectorAll('.shower-particle').forEach(el => el.remove());
            overlay.classList.add('active');

            // Stage 1: Veggies shower
            setTimeout(() => {
                for(let i=0; i<6; i++) {
                    setTimeout(() => {
                        const img = document.createElement('img');
                        img.src = product.img;
                        img.className = 'shower-particle';
                        img.style.left = `${20 + Math.random()*140}px`;
                        img.style.top = '-30px';
                        bag.appendChild(img);
                        requestAnimationFrame(() => {
                            img.style.transition = 'all 0.4s ease-out';
                            img.style.top = `${180 - Math.random()*70}px`;
                        });
                    }, i * 80);
                }
            }, 200);

            // Stage 2: Bag Seal
            setTimeout(() => {
                sealLine.classList.add('sealed');
                badge.innerText = "SEALED FRESH!";
            }, 1000);

            // Stage 3: Fly to Cart
            setTimeout(() => stage.classList.add('fly-to-cart'), 1500);

            // Stage 4: Add Cart item
            setTimeout(() => {
                overlay.classList.remove('active');
                addToCart(product);
            }, 2100);
        }

        function addToCart(product) {
            const existing = cart.find(i => i.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const countEl = document.getElementById('cartCount');
            const listEl = document.getElementById('cartList');
            const totalEl = document.getElementById('cartTotal');

            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            countEl.innerText = totalQty;
            totalEl.innerText = `₹${totalPrice}`;

            listEl.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.img}">
                    <div style="flex-grow:1;">
                        <div style="font-weight:700;">${item.name}</div>
                        <div style="font-size:0.85rem; color:var(--accent-bright);">₹${item.price} x ${item.qty}</div>
                    </div>
                    <div>₹${item.price * item.qty}</div>
                </div>
            `).join('');
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('active');
            document.getElementById('drawerOverlay').classList.toggle('active');
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("Cart khaali hai!");

            const name = document.getElementById('custName').value.trim();
            const address = document.getElementById('custAddr').value.trim();

            if (!name || !address) return alert("Naam aur Pata darj karein!");

            // 1. Prepare Google Sheet Stock Deduction Data
            // Unit me agar 500g hai to per item 500g subtract hoga
            const updateItems = cart.map(item => {
                let gramWeight = 1000; // default 1kg = 1000g
                if (item.unit.includes('500g')) gramWeight = 500;
                if (item.unit.includes('250g')) gramWeight = 250;
                
                return {
                    id: item.id,
                    qtyInGrams: gramWeight * item.qty
                };
            });

            // 2. Background POST request to Apps Script to update Sheet Stock live
            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ items: updateItems })
            });

            // 3. Open WhatsApp with formatted bill
            let msg = `🛒 *NEW ORDER - MB VEGETABLES*\n\n`;
            msg += `👤 *Customer:* ${name}\n`;
            msg += `📍 *Address:* ${address}\n\n`;
            msg += `📦 *ITEMS:*\n`;

            let grandTotal = 0;
            cart.forEach((item, index) => {
                const total = item.price * item.qty;
                grandTotal += total;
                msg += `${index + 1}. ${item.name} (${item.unit}) x ${item.qty} = ₹${total}\n`;
            });

            msg += `\n💰 *TOTAL:* ₹${grandTotal}`;
            
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
